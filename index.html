<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Decision Path Calculator</title><style>:root{font-family:Inter,system-ui;color:#16213a;background:#edf4ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#edf4ff,#f5efff)}main{width:min(94vw,980px);background:#fff;border-radius:28px;box-shadow:0 30px 80px #35558d24;padding:clamp(20px,5vw,48px)}header{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:28px}h1{font-size:clamp(2rem,5vw,3.8rem);line-height:1;margin:.2rem 0}.tag{color:#6d28d9;font-weight:700}.controls{display:grid;grid-template-columns:1fr auto 1fr auto;gap:12px}input,select,button{font:inherit;border-radius:14px;padding:16px;border:1px solid #cad5e7;background:#f8fbff}input{min-width:0;font-size:1.25rem}select{font-weight:800;color:#6d28d9}button{border:0;background:#6d28d9;color:white;font-weight:800;cursor:pointer}.result{margin:26px 0;padding:24px;border-radius:20px;background:#16213a;color:white;display:flex;justify-content:space-between;align-items:center}.result strong{font-size:clamp(2rem,6vw,4rem)}.path{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.node{padding:16px;border-radius:16px;background:#edf2f9;color:#60708b;transition:.2s}.node.active{background:#ede9fe;color:#5b21b6;box-shadow:inset 0 0 0 2px #8b5cf6}.node b{display:block;color:inherit}.error{color:#fda4af}@media(max-width:650px){header{display:block}.controls{grid-template-columns:1fr 80px}.controls button{grid-column:span 2}.path{grid-template-columns:1fr 1fr}}</style></head><body><main><header><div><span class="tag">Nested-if visualizer</span><h1>See the branch your math takes.</h1></div><p>Enter two values and watch the original C++ decision chain resolve.</p></header><section class="controls"><input id="a" type="number" value="24" aria-label="First number"><select id="op" aria-label="Operator"><option>+</option><option>−</option><option>×</option><option>÷</option></select><input id="b" type="number" value="6" aria-label="Second number"><button id="go">Calculate</button></section><section class="result" aria-live="polite"><span id="formula">24 + 6</span><strong id="answer">30</strong></section><section id="path" class="path"><div class="node"><b>if (+)</b>Addition</div><div class="node"><b>else if (−)</b>Subtraction</div><div class="node"><b>else if (×)</b>Multiplication</div><div class="node"><b>else if (÷)</b>Division guard</div></section><script>const ops=['+','−','×','÷'];function run(){const a=Number(document.querySelector('#a').value),b=Number(document.querySelector('#b').value),op=document.querySelector('#op').value,i=ops.indexOf(op);document.querySelectorAll('.node').forEach((n,j)=>n.classList.toggle('active',j===i));let r=op==='+'?a+b:op==='−'?a-b:op==='×'?a*b:b===0?'Cannot divide by zero':a/b;document.querySelector('#formula').textContent=`${a} ${op} ${b}`;const out=document.querySelector('#answer');out.textContent=typeof r==='number'?new Intl.NumberFormat('en-US',{maximumFractionDigits:8}).format(r):r;out.classList.toggle('error',typeof r!=='number')}document.querySelector('#go').onclick=run;document.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',run));run()</script></main></body></html>
